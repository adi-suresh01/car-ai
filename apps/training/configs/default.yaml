ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  net_arch:
    - 256
    - 256
  activation_fn: "tanh"

environment:
  num_envs: 8
  max_episode_steps: 3600
  cruise_target_mph: 65.0
  initial_speed_mps: 29.0

training:
  total_timesteps: 1_000_000
  save_interval: 50_000
  log_interval: 10
  eval_freq: 10_000
  eval_episodes: 5
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  seed: 42

export:
  onnx_path: "../../apps/frontend/public/rl/ppo-highway.onnx"
  opset_version: 17
