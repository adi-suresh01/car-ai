apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-ai-frontend
  namespace: cardrive
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: car-ai-frontend
  template:
    metadata:
      labels:
        app: car-ai-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/adi-suresh01/car-ai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: car-ai-frontend
  namespace: cardrive
spec:
  selector:
    app: car-ai-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-ai-frontend
  namespace: cardrive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-ai-frontend
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-ai
  namespace: cardrive
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: car-ai-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: car-ai-frontend
                port:
                  number: 80
