apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-ai-backend
  namespace: cardrive
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: car-ai-backend
  template:
    metadata:
      labels:
        app: car-ai-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/adi-suresh01/car-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: HOST
              value: 0.0.0.0
            - name: TRUST_PROXY
              value: "true"
            - name: JSON_BODY_LIMIT
              value: 1mb
            - name: RAW_BODY_LIMIT
              value: 16mb
            - name: UPSTREAM_TIMEOUT_MS
              value: "4500"
            - name: KEEP_ALIVE_TIMEOUT_MS
              value: "65000"
            - name: GRACEFUL_SHUTDOWN_MS
              value: "10000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: car-ai-backend
  namespace: cardrive
spec:
  selector:
    app: car-ai-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-ai-backend
  namespace: cardrive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-ai-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
