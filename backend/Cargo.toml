[package]
name = "voicedrive-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-rt = "2"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
bytestring = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
